[project]
name = "fpga-orch-step-engine"
version = "0.1.0"
description = "Contract-first FPGA orchestration step engine"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "pandas>=2.2,<3",
]

[project.scripts]
orch = "orch.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=data/test_tmp_pytest"

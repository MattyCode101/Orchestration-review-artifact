lessons:
- id: T0-1
  brief: T0
  source_design: rosetta_3d-rendering
  text: 'In an earlier case (goal: better timing; the logic-size limit may not grow) the best known result
    came from these calls in order: the area worker with re-placing allowed (the result stayed inside
    the limit); then the timing worker with placement preserved (the result stayed inside the limit);
    then the area worker with placement preserved (the result stayed inside the limit). Every step stayed
    within the limit, and the best known result needed both kinds of worker. Takeaway: Use both kinds
    of worker in one trajectory rather than committing to the brief''s own worker alone.'
- id: T0-2
  brief: T0
  source_design: vexriscv_re-place
  text: 'In an earlier case (goal: better timing; the logic-size limit may not grow) the best known result
    came from these calls in order: the area worker with re-placing allowed (the result stayed inside
    the limit); then the timing worker with re-placing allowed (the objective improved but the limit was
    broken); then the area worker with re-placing allowed (the result stayed inside the limit). An early
    step improved the objective but broke the limit. A policy that rolls back after every limit break
    would have thrown this path away. Takeaway: Keep the limit-breaking intermediate and spend the next
    call on the other worker, whose objective is the metric that was broken, so that the limit is recovered.'

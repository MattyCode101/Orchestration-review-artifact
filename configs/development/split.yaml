# Development split: screened designs used as orchestrator development designs (D3, Thu 12 Nov 2026). NOT frozen.
# Workers are NOT refitted: configs/workers/A_fit.json and B_fit.json (FINAL) and configs/workers/power.yaml are used as they are.
# Separate from the training split (scripts/thursday_night_pilot.py DESIGNS) and the test split (configs/campaign/campaign.yaml test_designs).
schema_version: development-split-v1
split: development
noise_file: configs/noise_development.yaml
never_use:   # sealed or round-1 test designs; no script of this task opens them
  - t2_or1200
  - rosetta_digit-recognition
  - corescore_500_mod
  - vexriscv_re-place_v2
  - fir_symmetric_systolic
  - fir_systolic_transposed
briefs:   # T0, A0, P0 are the frozen briefs (configs/briefs.yaml); W2R and L2R follow the power study's kind R
  T0: {objective: 'maximise wns_ns', limits: ['packed_clb_luts <= start']}
  A0: {objective: 'minimise packed_clb_luts', limits: ['wns_ns >= start']}
  W2R: {objective: 'maximise wns_ns', limits: ['packed_clb_luts <= start', 'dynamic_power_w <= start + power_band (inclusive, whole mW)']}
  L2R: {objective: 'minimise packed_clb_luts', limits: ['wns_ns >= start', 'dynamic_power_w <= start + power_band (inclusive, whole mW)']}
  P0: {objective: 'minimise dynamic_power_w', limits: ['wns_ns >= start', 'packed_clb_luts <= start']}
headroom_classes: {none: 'exhaustive gain under 1 band', low: '1 to 3 bands', high: 'over 3 bands'}
selection_rule: 'keep a screened candidate if its stored, AMD-checked exhaustive gain is at least 1 band in at least 2 of T0, A0, W2R, L2R, P0 (a lower bound: the screen explored depth 2 only partly)'

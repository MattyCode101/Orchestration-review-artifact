# LLM orchestrator and general-agent configuration (final specification, sections 3 and 8).
# Hashed into the Sunday freeze. The model id is a single value: the replay cache key contains it,
# so changing it means every LLM call is made again.
provider: gemini
model: gemini-3.1-flash-lite        # decision (c), notes/decisions.md: cheapest Gemini model that works for this key
temperature: 0.0
seed: 0
max_output_tokens: 2048
thinking_budget: null
timeout_ms: 60000
max_repair_turns: 2
rate_limit_per_minute: 60            # shared by every process through a lock directory
bridge:
  python: tools/llm_bridge/.venv/bin/python
  script: tools/llm_bridge/call.py
templates:
  orchestrator: configs/prompts/orchestrator_v1.txt
  general_agent: configs/prompts/general_agent_v1.txt
profiles_dir: configs/profiles
lessons: configs/lessons/lessons_training.yaml
configurations:
  F0: {mode: fuzzy, profiles: false, lessons: false}
  F1: {mode: fuzzy, profiles: true, lessons: false}     # intended main configuration
  E0: {mode: exact, profiles: false, lessons: false}
  E1: {mode: exact, profiles: true, lessons: false}
  F2: {mode: fuzzy, profiles: true, lessons: true}      # F1 plus the lessons block (fold-aware)

# LLM orchestrator and general-agent configuration, prompt wording R1 (the main wording; decision of 2026-11-07).
# R0 is configs/policies/llm_r0.yaml (the first wording, kept as the wording-sensitivity cell). This file and
# llm_r1.yaml are byte-identical. The model is the single value `model`; the replay cache key contains it.
# F2 (the lessons block) is dropped: a negative training result. It stays defined only so that the stored
# Saturday results remain readable; the stage driver refuses to plan it.
provider: gemini
model: gemini-3.1-flash-lite
temperature: 0.0
seed: 0
max_output_tokens: 2048
thinking_budget: null
timeout_ms: 60000
max_repair_turns: 2
rate_limit_per_minute: 60
bridge:
  python: tools/llm_bridge/.venv/bin/python
  script: tools/llm_bridge/call.py
templates:
  orchestrator: configs/prompts/orchestrator_v2.txt
  general_agent: configs/prompts/general_agent_v2.txt
profiles_dir: configs/profiles
lessons: configs/lessons/lessons_training.yaml
configurations:
  F0: {mode: fuzzy, profiles: false, lessons: false}
  F1: {mode: fuzzy, profiles: true, lessons: false}
  E0: {mode: exact, profiles: false, lessons: false}
  E1: {mode: exact, profiles: true, lessons: false}
  F2: {mode: fuzzy, profiles: true, lessons: true, dropped: true}

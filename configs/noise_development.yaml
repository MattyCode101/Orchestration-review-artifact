# Noise bands for the development split and the missing logicnets_jscl band.
# Same schema as configs/noise.yaml (load with orch.config.load_noise). Absolute values: ns, packed LUTs, W.
# configs/noise.yaml is hashed in the freeze (139 files), so it is not edited; round 2 can merge this file at its freeze.
# Development designs: band = maximum absolute difference of the screen's five controls (n_repeat, n_thr4, n_unc0.001/2/3)
# to B2, effective value (raised to the metric's resolution where smaller); source file and its SHA-256 are named per band.
# logicnets_jscl: the run-3 Family N range (6 samples) that the power study and the bandit study already used.
bands:

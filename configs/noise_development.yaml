    wns_ns: {value: 0.033, basis: ns, relative: false, samples: 5, source: "benchmark screen data/noise/t2_cordic_s/bands.json band_effective (sha256 e7c7e0d237785027d2dfe65095260113169fc6d9c425ffc69a2f7a4ab1230631)"}
